# ==========================================================================
# Render Blueprint — Facility Contábil no ar (tela + API + leitor de extratos).
# O banco é o Supabase (nuvem), configurado à parte.
#
# Primeiro deploy: Render → New → Blueprint → este repositório. O Render só
# pede os valores do Supabase (sync: false); o segredo API↔leitor é gerado.
# Os serviços se acham pelos endereços públicos https://facility-contabil-mastro*.onrender.com
# (o endereço nasce do nome na criação e não muda depois) — se o Render der
# outro endereço a algum serviço, ajuste PARSER_URL, FRONTEND_ORIGIN,
# VITE_API_URL e VITE_PARSER_URL (e o connect-src da CSP) abaixo.
#
# NOMES: o Blueprint liga cada serviço do painel ao daqui PELO NOME. Em
# 2026-11-23 os serviços foram renomeados no painel (sem "mastro") e os nomes
# abaixo foram acertados junto; os endereços continuaram os antigos. Renomear
# um serviço no painel sem mudar aqui (ou o contrário) faz a sincronização
# CRIAR um serviço novo em vez de atualizar o que está no ar.
#
# Plano: API e leitor no `starter` (0,5 CPU / 512 MB, pago por hora, ~US$ 7/mês
# cada) desde 2026-11-17 — não dormem. A tela é site estático (grátis).
# Este arquivo manda no plano: se voltar pra `free`, a sincronização do
# Blueprint rebaixa os serviços. No free cada serviço dorme após 15 min sem uso
# e leva ~1 min pra acordar; por isso a tela ainda acorda o leitor
# (VITE_PARSER_URL) e a API espera ele subir antes de desistir — inofensivo no
# starter, e mantém o sistema funcionando se um dia voltar pro free.
# ==========================================================================

envVarGroups:
  - name: facility-contabil-segredo
    envVars:
      # segredo compartilhado API ↔ leitor (header X-Parser-Secret)
      - key: PARSER_SHARED_SECRET
        generateValue: true

services:
  # ------------------------------------------------------------------------
  # Leitor de extratos (Python/FastAPI) — parser/
  # ------------------------------------------------------------------------
  - type: web
    name: facility-contabil-parser
    runtime: python
    plan: starter
    region: virginia
    rootDir: parser
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # marca do Blueprint (o código não lê): força a sincronização a registrar
      # o serviço na aba Resources do Blueprint depois da troca de nomes (2026-11-23)
      - key: BLUEPRINT
        value: facility-contabil
      - fromGroup: facility-contabil-segredo

  # ------------------------------------------------------------------------
  # API (Node/Express) — backend/ (workspace npm, instalado pela raiz)
  # ------------------------------------------------------------------------
  - type: web
    name: facility-contabil-api
    runtime: node
    plan: starter
    region: virginia
    # --include=dev: o build (tsc) precisa das devDependencies mesmo com NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build -w backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      # porta que o Render espera (PORT padrão = 10000)
      - key: BACKEND_PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      # publishable key (sb_publishable_...)
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PARSER_URL
        value: https://facility-contabil-mastro-parser.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://facility-contabil-mastro.onrender.com
      # link do convite / nova senha que o cliente recebe por e-mail
      - key: APP_URL
        value: https://facility-contabil-mastro.onrender.com
      # secret key do Supabase (sb_secret_...) — acesso do cliente e convites.
      # Em serviço já criado, o Render NÃO pede: cadastrar no painel (Environment).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # marca do Blueprint (o código não lê): força a sincronização a registrar
      # o serviço na aba Resources do Blueprint depois da troca de nomes (2026-11-23)
      - key: BLUEPRINT
        value: facility-contabil
      - fromGroup: facility-contabil-segredo

  # ------------------------------------------------------------------------
  # Tela (React/Vite) — site estático, frontend/
  # ------------------------------------------------------------------------
  - type: web
    name: facility-contabil
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w frontend
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    routes:
      # SPA: qualquer rota (/clientes, /revisao/:id...) abre o index.html
      - type: rewrite
        source: /*
        destination: /index.html
    # Cabeçalhos de segurança da tela. CSP: só roda script do próprio site e só
    # conversa com a API, o Supabase e o /health do leitor (pra acordá-lo) — um
    # script injetado não consegue mandar os dados (nem o login guardado no
    # navegador) pra outro lugar.
    # frame-ancestors / X-Frame-Options: ninguém embute o sistema num iframe
    # (clickjacking). Se mudar o endereço da API ou do leitor, ajuste o connect-src.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://facility-contabil-mastro-api.onrender.com https://facility-contabil-mastro-parser.onrender.com https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_SUPABASE_URL
        sync: false
      # publishable key (sb_publishable_...)
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        value: https://facility-contabil-mastro-api.onrender.com
      # só pra acordar o leitor que dormiu (frontend/src/lib/acordarLeitor.ts)
      - key: VITE_PARSER_URL
        value: https://facility-contabil-mastro-parser.onrender.com
      # marca do Blueprint (o código não lê): força a sincronização a registrar
      # o serviço na aba Resources do Blueprint depois da troca de nomes (2026-11-23)
      - key: BLUEPRINT
        value: facility-contabil
